<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Juice Shop Clone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }
    .login-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 40px 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
      text-align: center;
      color: #222;
    }
    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #ff8c00;
    }
    .error {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 4px;
      min-height: 14px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: #ff8c00;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #e67e00; }
    #formMessage {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
    }
    #formMessage.success { color: #2e7d32; }
    #formMessage.failure { color: #d32f2f; }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>Login</h1>
    <form id="loginForm" novalidate>
      <label for="email">Email address</label>
      <input type="text" id="email" name="email" autocomplete="off">
      <div class="error" id="emailError"></div>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="off">
      <div class="error" id="passwordError"></div>

      <button type="submit">Log in</button>
      <div id="formMessage"></div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
